# Tag vX.Y.Z (matching ambient/config.yaml "version") -> ghcr.io/<owner>/ambient:X.Y.Z + :latest, amd64 + arm64.
name: image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          v=$(sed -n 's/^version: "\(.*\)"/\1/p' ambient/config.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match ambient/config.yaml version $v"; exit 1; fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.hass.type=addon
            io.hass.version=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ambient:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ambient:latest
