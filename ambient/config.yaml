name: ambient
version: "0.1.0"
slug: ambient
description: Alexa-style idle screen for kiosks and Echo Shows — photos, weather, scores, webcams, fun clocks
url: https://github.com/nawagner85/ambient
image: ghcr.io/nawagner85/ambient
arch: [aarch64, amd64]
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
ingress_entry: admin
panel_icon: mdi:television-ambient-light
panel_title: ambient
panel_admin: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Screens — point a kiosk browser at http://<this host>:8099/?show=<view>
backup: hot
